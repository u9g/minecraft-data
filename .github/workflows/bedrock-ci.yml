name: bedrock-ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        repository: 'PrismarineJS/node-minecraft-data'
        submodules: 'recursive'
        path: node-mcdata
    - run: rm -rf minecraft-data
    - uses: actions/checkout@v2
      with:
        path: node-mcdata/minecraft-data
    - run: ls -R .
